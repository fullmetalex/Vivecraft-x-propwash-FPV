plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Propwash FPV and Vivecraft in the dev client (runClient).
    if (rootProject.fileTree('libs') { include '*.jar' }.isEmpty()) {
        runtimeOnly(propwashCoordinate) {
            transitive = false
        }
        runtimeOnly(vivecraftCoordinate) {
            transitive = false
        }
    }
}
